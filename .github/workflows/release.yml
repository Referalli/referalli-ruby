# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
# Publishes to RubyGems when a vX.Y.Z tag is pushed (the monorepo's sync-mirrors.ts --tag does that).
# Trusted publishing: on rubygems.org add a (pending) trusted publisher for gem "referalli":
# repository Referalli/referalli-ruby, workflow release.yml, environment rubygems.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Version matches the tag
        run: |
          set -euo pipefail
          version=$(ruby -e 'spec = Gem::Specification.load(Dir["*.gemspec"].first); print spec.version')
          test "$version" = "${GITHUB_REF_NAME#v}"
      - run: gem build *.gemspec
      - uses: rubygems/configure-rubygems-credentials@v1.0.0
      - run: gem push *.gem
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
