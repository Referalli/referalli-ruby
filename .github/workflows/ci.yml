# Generated by the Referalli monorepo (scripts/release/mirror-files); edits here are overwritten on the next sync.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      - name: Lint (syntax and warnings)
        run: find lib test -name '*.rb' -print0 | xargs -0 -n1 ruby -wc
      - name: Tests
        run: |
          set -e
          for f in test/test_*.rb; do ruby -Ilib "$f" testdata/webhook-vectors.json; done
      - name: Build
        run: gem build *.gemspec
